<!DOCTYPE html>

<html>

<head>
    <title>Admin - TechGeek</title>

    <!-- קובץ העיצוב של האתר -->
    <link rel="stylesheet" href="paycss.css">
</head>

<body>

    <h1>Admin Dashboard</h1>

    <h2>Registered Users</h2>


    <!-- טבלה להצגת המשתמשים הרשומים -->
    <table border="1">

        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
        </thead>

        <!-- לכאן ייכנסו המשתמשים שנקבל מהשרת -->
        <tbody id="usersTable"></tbody>

    </table>


    <script>

        // פונקציה שטוענת את המשתמשים ובודקת הרשאת מנהל
        async function loadUsers() {


            // קבלת פרטי המשתמש המחובר מ-localStorage
            const username = localStorage.getItem("username");
            const role = localStorage.getItem("role");


            // בדיקה ראשונית - האם המשתמש הוא admin
            if (role !== "admin") {

                alert("Access denied");

                // אם לא מנהל - חוזר לדף הבית
                window.location.href = "home.html";

                return;
            }


            // שליחת בקשה לשרת לקבלת רשימת המשתמשים
            // שם המשתמש נשלח כדי שהשרת יוודא שהוא באמת admin
            const response = await fetch(
                `http://localhost:3000/users?username=${username}`
            );


            // אם השרת דחה את הבקשה - אין הרשאה
            if (!response.ok) {

                alert("Access denied");

                window.location.href = "home.html";

                return;
            }


            // קבלת רשימת המשתמשים מהשרת כ-JSON
            const users = await response.json();


            // מציאת גוף הטבלה ב-HTML
            const table = document.getElementById("usersTable");


            // מעבר על כל המשתמשים שהתקבלו
            users.forEach(user => {

                // הוספת כל משתמש כשורה חדשה בטבלה
                table.innerHTML += `
                    <tr>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                    </tr>
                `;

            });

        }


        // הפעלת הפונקציה כאשר הדף נטען
        loadUsers();

    </script>

</body>

</html>
