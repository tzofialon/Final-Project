<!DOCTYPE html>
<html>

<head>
    <title>TechGeek</title>

    <!-- קובץ העיצוב של האתר -->
    <link rel="stylesheet" href="paycss.css">
</head>


<body class="Advanced gadgets">

    <header>

        <h1>Advanced gadgets</h1>

        <!-- כאן יוצג שם המשתמש המחובר -->
        <h2 id="welcome-user"></h2>


        <!-- מעבר לסל הקניות -->
        <a href="shopcart.html">
            <div>

                <img src="images/cssimages/sopping.jpeg"
                     style="width: 70px; height:70px;">

                <!-- מספר המוצרים בסל -->
                <span id="cart-count">0</span>

            </div>
        </a>


        <button onclick="logout()">Logout</button>


        <!-- חזרה לדף הבית -->
        <a href="home.html">
            <button>back</button>
        </a>


        <!-- מעבר לדף ההתחברות -->
        <a href="login.html">
            <button>Login</button>
        </a>

    </header>


    <main>

        <!-- אזור סינון המוצרים לפי מחיר -->
        <div class="filters">

            <h2>Filters</h2>

            <div>

                <label for="price-min">min price</label>

                <input type="number"
                       id="price-min"
                       placeholder="minimum">


                <label for="price-max">max price</label>

                <input type="number"
                       id="price-max"
                       placeholder="maximum">

            </div>


            <!-- הפעלת פונקציית הסינון -->
            <button onclick="filterCars()">get filter</button>

        </div>


        <!-- לכאן ייכנסו המוצרים שמתקבלים מ-MongoDB -->
        <div id="car-list" class="car-gallery"></div>

    </main>


    <footer class="footer">
        <p>© 2024 TechGeek. All rights reserved.</p>
    </footer>


    <!-- פונקציות כלליות של האתר -->
    <script src="javaAll.js"></script>


    <script>

        // פונקציה שטוענת את המוצרים מהשרת
        async function loadProducts() {

            try {

                // שליחת בקשה לשרת לקבלת המוצרים
                const response =
                    await fetch("http://localhost:3000/products");


                // קבלת המוצרים מהשרת כ-JSON
                const products =
                    await response.json();


                // מציאת האזור ב-HTML שבו יוצגו המוצרים
                const productList =
                    document.getElementById("car-list");


                // ניקוי האזור לפני הצגת המוצרים
                productList.innerHTML = "";


                // מעבר על כל המוצרים שהתקבלו מהשרת
                products.forEach(product => {


                    // יצירת כרטיס HTML עבור כל מוצר
                    productList.innerHTML += `

                        <div class="car-item">

                            <img src="${product.image}">

                            <h3>${product.name}</h3>

                            <p>${product.description}</p>

                            <p>price: ${product.price} ₪</p>

                            <span id="inventory_${product.productId}"></span>

                            <br>


                            <!-- הוספת המוצר לסל -->
                            <button onclick="addToCart(
                                ${product.productId},
                                '${product.name}',
                                ${product.price},
                                '${product.image}'
                            )">
                                add to cart
                            </button>

                        </div>
                    `;

                });


            } catch (error) {

                // במקרה של שגיאה בטעינת המוצרים
                console.log(
                    "Error loading products:",
                    error
                );

            }
        }


        // הפעלת הפונקציה כאשר הדף נטען
        loadProducts();

    </script>


</body>

</html>
